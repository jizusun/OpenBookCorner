name: Preview

# SINGLE SHARED preview of the `openbookcorner` Worker via native Worker Previews
# (`wrangler preview`). ALL PRs deploy over ONE preview named `preview` at
# https://preview.openbookcorner.jizu.dev (custom-domain route previews_enabled in
# wrangler.jsonc; covered by the *.openbookcorner.jizu.dev wildcard cert and
# trusted by Better Auth, so login works). It binds the shared preview D1 + R2
# from the `previews` block — never production data.
#
# Last-deploy-wins: the most recent PR push becomes THE preview. This matches the
# shared preview database (all PRs already share one D1). Deploys are serialized
# via concurrency so concurrent pushes don't race the shared Worker/DB.
#
# Requires repo secret:
#   CLOUDFLARE_API_TOKEN — Workers Scripts: Edit, D1: Edit, R2: Edit,
#                          Account Settings: Read, Zone Workers Routes: Edit
# BETTER_AUTH_SECRET for the preview is set ONCE in the Previews base config
# (`wrangler preview base-config secret put BETTER_AUTH_SECRET`) and inherited —
# no per-deploy secret handling. CLOUDFLARE_ACCOUNT_ID is a non-secret env below.

on:
  pull_request:
    types: [opened, synchronize, reopened]

# One shared preview → serialize all deploys (never run two at once); do not
# cancel an in-flight deploy, let it finish before the next PR's push deploys.
concurrency:
  group: preview-shared
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  deployments: write

env:
  CLOUDFLARE_ACCOUNT_ID: 69f6e3b623318562cf2917e23251be5d
  PREVIEW_D1_ID: 6d67a9a0-0ac1-4c50-bbef-6c035e3300a7
  PREVIEW_NAME: preview

jobs:
  preview:
    # Only run on same-repo PRs (secrets aren't available to forks anyway).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate route tree
        run: bun --cwd apps/app generate-routes

      - name: Build SPA
        run: bun --cwd apps/app build

      - name: Apply D1 migrations to the shared preview DB
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.1'
          # Targets the preview D1 via `preview_database_id` on the DB binding.
          command: d1 migrations apply DB --remote --preview

      - name: Deploy the shared Preview (same Worker)
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.1'
          # Creates a GitHub Deployment + exposes the preview-url output.
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # BETTER_AUTH_SECRET is inherited from the Previews base config, so no
          # per-deploy --secrets-file is needed. Fixed name → one shared preview.
          command: preview --name preview

      - name: Seed demo users into the preview DB
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SEED_D1_BINDING: DB
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
        run: |
          chmod +x db/scripts/seed-users.sh
          db/scripts/seed-users.sh "$PREVIEW_URL" "$PREVIEW_D1_ID"

      - name: Comment the Preview URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --edit-last --create-if-none \
            --body "🚀 **Preview:** ${PREVIEW_URL}

          Demo accounts (password \`password123\`): \`reader@demo.test\`, \`admin@demo.test\`, \`super@demo.test\`.
          Shared preview of the \`openbookcorner\` Worker — the latest PR push deploys here (last-deploy-wins)."
