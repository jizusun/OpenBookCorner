name: Preview

# Per-PR preview of the SAME `openbookcorner` Worker via native Worker Previews
# (`wrangler preview`). Each PR gets an isolated preview at
# https://pr-<N>.openbookcorner.jizu.dev (custom-domain route previews_enabled in
# wrangler.jsonc; covered by the *.openbookcorner.jizu.dev wildcard cert and
# trusted by Better Auth, so login works). Previews bind the isolated preview
# D1 + R2 from the `previews` block — never production data.
#
# Requires repo secrets:
#   CLOUDFLARE_API_TOKEN        — Workers Scripts: Edit, D1: Edit, R2: Edit,
#                                 Account Settings: Read, Zone Workers Routes: Edit
#   PREVIEW_BETTER_AUTH_SECRET  — session-signing secret for previews
# CLOUDFLARE_ACCOUNT_ID is a non-secret env below.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  deployments: write

env:
  CLOUDFLARE_ACCOUNT_ID: 69f6e3b623318562cf2917e23251be5d
  PREVIEW_D1_ID: 6d67a9a0-0ac1-4c50-bbef-6c035e3300a7

jobs:
  preview:
    # Only run on same-repo PRs (secrets aren't available to forks anyway).
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate route tree
        run: bun --cwd apps/app generate-routes

      - name: Build SPA
        run: bun --cwd apps/app build

      - name: Apply D1 migrations to the preview DB
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.1'
          command: d1 migrations apply openbookcorner-preview --remote

      - name: Deploy per-PR Preview (same Worker)
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_BETTER_AUTH_SECRET: ${{ secrets.PREVIEW_BETTER_AUTH_SECRET }}
        run: |
          set -o pipefail
          # Provision the session-signing secret SCOPED TO THE PREVIEW via
          # --secrets-file (the Worker fails closed in preview without it). This
          # targets the preview deployment, NOT the production Worker.
          printf 'BETTER_AUTH_SECRET=%s\n' "$PREVIEW_BETTER_AUTH_SECRET" > /tmp/preview-secrets.env
          output="$(bunx wrangler preview \
            --name "pr-${{ github.event.pull_request.number }}" \
            --secrets-file /tmp/preview-secrets.env \
            --json)"
          rm -f /tmp/preview-secrets.env
          printf '%s\n' "$output"
          preview_url="$(printf '%s' "$output" | jq -er '.preview.urls[0]')"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Seed demo users into the preview DB
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SEED_D1_NAME: openbookcorner-preview
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          chmod +x db/scripts/seed-users.sh
          db/scripts/seed-users.sh "$PREVIEW_URL" "$PREVIEW_D1_ID"

      - name: Comment the Preview URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --edit-last --create-if-none \
            --body "🚀 **Preview:** ${PREVIEW_URL}

          Demo accounts (password \`password123\`): \`reader@demo.test\`, \`admin@demo.test\`, \`super@demo.test\`.
          Per-PR isolated preview of the \`openbookcorner\` Worker."

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete the PR's Preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.1'
          command: preview delete --name pr-${{ github.event.pull_request.number }} --skip-confirmation
