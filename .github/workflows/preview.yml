name: Preview

# Per-PR preview of the SAME `openbookcorner` Worker via native Worker Previews
# (`wrangler preview`). Each PR gets an isolated preview at
# https://pr-<N>.openbookcorner.jizu.dev (custom-domain route previews_enabled in
# wrangler.jsonc; covered by the *.openbookcorner.jizu.dev wildcard cert and
# trusted by Better Auth, so login works). Previews bind the isolated preview
# D1 + R2 from the `previews` block — never production data.
#
# Requires repo secrets:
#   CLOUDFLARE_API_TOKEN        — Workers Scripts: Edit, D1: Edit, R2: Edit,
#                                 Account Settings: Read, Zone Workers Routes: Edit
# BETTER_AUTH_SECRET for previews is set ONCE in the Previews base config
# (`wrangler preview base-config secret put BETTER_AUTH_SECRET`) and inherited by
# every preview — no per-deploy secret handling needed.
# CLOUDFLARE_ACCOUNT_ID is a non-secret env below.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  deployments: write

env:
  CLOUDFLARE_ACCOUNT_ID: 69f6e3b623318562cf2917e23251be5d
  PREVIEW_D1_ID: 6d67a9a0-0ac1-4c50-bbef-6c035e3300a7

jobs:
  preview:
    # Only run on same-repo PRs (secrets aren't available to forks anyway).
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate route tree
        run: bun --cwd apps/app generate-routes

      - name: Build SPA
        run: bun --cwd apps/app build

      - name: Apply D1 migrations to the preview DB
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.1'
          # Targets the preview D1 via `preview_database_id` on the DB binding.
          command: d1 migrations apply DB --remote --preview

      - name: Deploy per-PR Preview (same Worker)
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.1'
          # Creates a GitHub Deployment + exposes the preview-url output.
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # BETTER_AUTH_SECRET is inherited from the Previews base config
          # (set once via `wrangler preview base-config secret put`), so no
          # per-deploy --secrets-file is needed.
          command: preview --name pr-${{ github.event.pull_request.number }}

      - name: Seed demo users into the preview DB
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SEED_D1_BINDING: DB
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
        run: |
          chmod +x db/scripts/seed-users.sh
          db/scripts/seed-users.sh "$PREVIEW_URL" "$PREVIEW_D1_ID"

      - name: Comment the Preview URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --edit-last --create-if-none \
            --body "🚀 **Preview:** ${PREVIEW_URL}

          Demo accounts (password \`password123\`): \`reader@demo.test\`, \`admin@demo.test\`, \`super@demo.test\`.
          Per-PR isolated preview of the \`openbookcorner\` Worker."

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete the PR's Preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.1'
          command: preview delete --name pr-${{ github.event.pull_request.number }} --skip-confirmation
