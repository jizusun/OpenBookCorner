name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck · Unit · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs Node from .mise.toml and enables Corepack (node.corepack=true),
      # which puts the pnpm shim (version from packageManager) on PATH.
      - name: Set up mise (Node + Corepack pnpm)
        uses: jdx/mise-action@v2

      - name: Verify pnpm
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate route tree
        run: pnpm run generate-routes

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm run lint
        continue-on-error: true

      - name: Unit & component tests
        run: pnpm run test:unit

      - name: Build
        run: pnpm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up mise (Node + Corepack pnpm)
        uses: jdx/mise-action@v2

      - name: Verify pnpm
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate route tree
        run: pnpm run generate-routes

      - name: Install Playwright browsers (with OS deps)
        run: pnpm exec playwright install --with-deps chromium

      - name: Build (production, served by wrangler dev in E2E)
        run: pnpm run build

      - name: Run E2E tests
        run: pnpm run test:e2e
        env:
          E2E_SKIP_BUILD: '1'

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
