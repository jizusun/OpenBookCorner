name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate route tree
        run: bun --cwd apps/app generate-routes

      - name: Typecheck (db -> api -> app)
        run: bun run typecheck

      - name: Unit & component tests
        run: |
          bun run test
          bun --cwd apps/app test

      - name: Build SPA
        run: bun --cwd apps/app build

      - name: Build API (dry run)
        run: bun --cwd apps/api build
