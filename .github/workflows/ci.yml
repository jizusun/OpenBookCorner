name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate route tree
        run: bun --cwd apps/app generate-routes

      - name: i18n catalogs in sync & fully translated
        run: |
          # 1) Re-extract against the source; the committed .po catalogs must
          #    not change (every <Trans>/t`` string must already be extracted).
          bun --cwd apps/app i18n:extract -- --clean
          if ! git diff --quiet -- 'apps/app/lib/i18n/locales/*.po'; then
            echo "::error::i18n catalogs are out of sync with the source."
            echo "Run 'bun --cwd apps/app i18n:extract' and commit the updated .po files."
            git --no-pager diff --stat -- 'apps/app/lib/i18n/locales/*.po'
            exit 1
          fi
          # 2) Fail if any non-source locale has untranslated (empty) entries.
          bun --cwd apps/app run scripts/check-translations.ts
          # 3) Compile the runtime catalogs (gitignored) so the typecheck/build
          #    below can resolve ./locales/{en,zh}. --strict also fails on any
          #    missing message (Lingui's built-in guard, belt-and-suspenders).
          bun --cwd apps/app i18n:compile -- --strict

      - name: i18n lint (Lingui macro rules)
        run: bun --cwd apps/app i18n:lint

      - name: Typecheck (db -> api -> app)
        run: bun run typecheck

      - name: Unit & component tests
        run: |
          bun run test
          bun --cwd apps/app test

      - name: Build SPA
        run: bun --cwd apps/app build

      - name: Build API (dry run)
        run: bun --cwd apps/api build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate route tree
        run: bun --cwd apps/app generate-routes

      - name: Install Playwright browser
        run: cd e2e && bunx playwright install --with-deps chromium

      - name: Run E2E tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
