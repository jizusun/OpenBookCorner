[tools]
node = "lts"
# pnpm is provided by corepack (Node ships it) via the packageManager field in
# package.json. We intentionally do NOT pin pnpm through mise's npm/aqua backend,
# which is currently flaky (jdx/mise#7630, #7022 — causes `pnpm: command not found`).

[env]
NODE_ENV = "development"

[tasks.install]
description = "Install all dependencies"
run = "pnpm install"

[tasks.dev]
description = "Start development servers"
run = "pnpm run dev"

[tasks.build]
description = "Build all packages"
run = "pnpm run build"

[tasks.test]
description = "Run all tests"
run = "pnpm run test"

[tasks.lint]
description = "Lint all packages"
run = "pnpm run lint"

[tasks.format]
description = "Format all code"
run = "pnpm run format"
