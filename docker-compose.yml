# Self-hosted OpenBookCorner on a small VPS/SBC.
#   app        — Bun server (SPA + API), SQLite + local covers on the `data` volume
#   litestream — continuous SQLite backup/replication to S3-compatible storage
#
# Set secrets via a .env file next to this (see .env.example). Litestream is
# optional: comment it out if you don't want continuous backup yet.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: openbookcorner-selfhost
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      ENVIRONMENT: production
      APP_NAME: OpenBookCorner
      APP_ORIGIN: ${APP_ORIGIN:?set APP_ORIGIN, e.g. https://library.example.com}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set a 32+ char secret}
      DB_PATH: /data/obc.db
      PORT: '3000'
    volumes:
      - data:/data

  # Continuous, near-real-time SQLite backup to object storage (R2/B2/MinIO…).
  # Restore with: litestream restore -o /data/obc.db ${LITESTREAM_URL}
  litestream:
    image: litestream/litestream:0.3
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    environment:
      # Credentials for the replica destination (S3-compatible).
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:-}
    command: ['replicate']

volumes:
  data:
